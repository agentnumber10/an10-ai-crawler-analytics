<!--
  The Agent Number 10 mark at small sizes: a filled gradient disc with a
  white 10. The 10 is drawn as shapes, not text, because an icon is a
  standalone document with no web font to use. The same file is the
  favicon (marketing), apps/web/app/icon.svg, and the admin and CMS icons;
  BaseLayout also serves it as the Organization logo in JSON-LD.
  No double hyphen in this comment: XML forbids it, and
  apps/web/app/icon.test.ts checks this.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/>
      <stop offset="0.34" stop-color="#7c3aed"/>
      <stop offset="0.66" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#mark)"/>
  <path d="M168 148 L204 148 L204 364 L158 364 L158 206 L122 222 L122 180 Z" fill="#ffffff"/>
  <rect x="262" y="172" width="104" height="168" rx="52" fill="none" stroke="#ffffff" stroke-width="48"/>
</svg>
