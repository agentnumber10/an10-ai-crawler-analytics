name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: a changed title is checked again, since it becomes the commit.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard (private text, commit messages, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Files and commit messages
        env:
          GUARD_PATTERNS: ${{ secrets.GUARD_PATTERNS }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          bin/guard.sh
          bin/guard.sh --commits "$RANGE"
      - name: Pull request title (it becomes the squash commit)
        if: github.event_name == 'pull_request'
        env:
          GUARD_PATTERNS: ${{ secrets.GUARD_PATTERNS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" >"$RUNNER_TEMP/pr-title.txt"
          bin/guard.sh --message "$RUNNER_TEMP/pr-title.txt"
      - name: Secrets in the full history (gitleaks)
        run: |
          version=8.30.1
          base=https://github.com/gitleaks/gitleaks/releases/download/v$version
          curl -sSfLO "$base/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${version}_checksums.txt" | grep "gitleaks_${version}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner .

  php:
    name: Lint and tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: php bin/generate.php --check
      - run: vendor/bin/phpcs -q
      - run: vendor/bin/phpunit --no-coverage

  build:
    name: Build the release zip
    needs: [guard, php]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: bash bin/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: build/an10-ai-crawler-analytics
          if-no-files-found: error

  plugin-check:
    name: WordPress.org Plugin Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: build/an10-ai-crawler-analytics
      - uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: build/an10-ai-crawler-analytics
          slug: an10-ai-crawler-analytics
          include-experimental: 'true'

  activation:
    name: Clean install, WP_DEBUG on, no outbound requests before opt-in
    needs: build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: build/an10-ai-crawler-analytics
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli
          tools: wp-cli
      - name: Activation test
        env:
          DB_NAME: wordpress
          DB_USER: wordpress
          DB_PASSWORD: wordpress
          DB_HOST: 127.0.0.1:3306
        run: bash bin/activation-test.sh build/an10-ai-crawler-analytics
