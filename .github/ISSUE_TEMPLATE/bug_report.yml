name: Bug report
description: Something in the plugin does not work as described.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Plugin, WordPress and PHP versions
      placeholder: 0.1.0, WordPress 6.8, PHP 8.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Caching, CDN or proxy in front of the site
      description: For example Cloudflare, a page cache plugin, or your host's own cache.
